name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk FocusLock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: FocusLock.apk

      # Direct download link for the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/FocusLock.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FocusLock.apk \
            --title "Focus Lock build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --latest
